name: Clean History & Recalculate

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Clean History
        run: python clean_history.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-clean history anomalies and update data.json" && git push)
