name: Daily ETM Scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Запуск быстрого сбора данных
        run: |
          python scraper.py

      - name: Фиксация изменений и отправка в репозиторий
        shell: cmd
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json errors.json index.html history/
          git commit -m "Auto-update ETM data with history [skip ci]" || echo No changes to commit
          
          for /l %%i in (1, 1, 3) do (
            git push origin main && goto :push_success
            echo Попытка push не удалась, повтор через 5 секунд...
            timeout /t 5 /nobreak >nul
          )
          exit 1
          :push_success
          echo Данные успешно отправлены на GitHub!
