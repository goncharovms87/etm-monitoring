name: Daily ETM Scraper

on:
  schedule:
    # Запуск каждый день в 03:00 по МСК (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Возможность запустить вручную кнопкой

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Запуск парсера
        run: |
          python scraper.py

      - name: Коммит и пуш обновленных данных
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Изменений нет, коммит не требуется."
          else
            git commit -m "Auto-update ETM data [skip ci]"
            git push
          fi
