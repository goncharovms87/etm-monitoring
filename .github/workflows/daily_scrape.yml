name: Daily ETM Scraper

on:
  schedule:
    # Запуск каждую ночь в 03:00 МСК (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка Playwright и зависимостей
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Запуск сбора данных
        run: |
          python scraper.py

      - name: Фиксация изменений и отправка в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Новых изменений нет."
          else
            git commit -m "Auto-update ETM data [skip ci]"
            git push origin main
          fi
