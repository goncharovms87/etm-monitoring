name: Daily ETM Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: self-hosted
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Запуск сбора данных
        shell: cmd
        run: |
          python scraper.py

      - name: Фиксация изменений и отправка в репозиторий
        shell: cmd
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update ETM data [skip ci]" || echo No changes to commit
          
          for /l %%i in (1, 1, 3) do (
            git push origin main && goto :push_success
            echo Попытка push не удалась, повтор через 5 секунд...
            timeout /t 5 /nobreak >nul
          )
          exit 1
          :push_success
          echo Данные успешно отправлены на GitHub!
