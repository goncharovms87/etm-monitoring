name: Daily ETM Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: self-hosted
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Запуск сбора данных
        shell: cmd
        run: |
          python scraper.py

      - name: Фиксация изменений и отправка в репозиторий
        shell: cmd
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update ETM data [skip ci]" || echo No changes to commit
          git push origin main
