- name: Запуск сбора данных v2
        run: |
          python etm_parser_v2.py

      - name: Фиксация изменений и отправка в репозиторий
        shell: cmd
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_v2.json errors_v2.json index.html
          git commit -m "Auto-update ETM data v2 [skip ci]" || echo No changes to commit
          
          for /l %%i in (1, 1, 3) do (
            git push origin main && goto :push_success
            echo Попытка push не удалась, повтор через 5 секунд...
            timeout /t 5 /nobreak >nul
          )
          exit 1
          :push_success
          echo Данные v2 успешно отправлены на GitHub!
