<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг каталога ЭТМ | Программируемые реле</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-header-custom { background-color: #0d6efd; color: #fff; }
    .stock-badge { min-width: 48px; display: inline-block; text-align: center; }
  </style>
</head>
<body class="py-4">
  <div class="container-fluid px-4">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h4 class="card-title fw-bold mb-1">Остатки и цены: Программируемые реле (ЭТМ)</h4>
          <p class="text-muted mb-0 small">
            Категории: <code>751025</code> (Модули расширения), <code>75102510</code> (Реле)
          </p>
        </div>
        <div class="text-end">
          <span class="badge bg-secondary mb-1" id="update-date">Обновление: загрузка...</span>
          <div class="small text-muted" id="total-count">Позиций: —</div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div id="table-wrapper"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(payload => {
        document.getElementById('update-date').textContent = 'Обновлено: ' + payload.last_updated;
        document.getElementById('total-count').textContent = 'Всего позиций: ' + payload.total_items;

        new gridjs.Grid({
          columns: [
            { name: "Производитель", id: "brand", sort: true, width: "160px" },
            { name: "Артикул вендора", id: "vendor_code", sort: true, width: "160px" },
            { name: "Код ЭТМ", id: "etm_code", width: "130px" },
            { 
              name: "Наименование", 
              id: "name",
              formatter: (cell, row) => {
                const url = row.cells[7].data;
                return gridjs.html(`<a href="${url}" target="_blank" class="text-decoration-none fw-semibold">${cell}</a>`);
              }
            },
            { 
              name: "Цена, ₽", 
              id: "price", 
              sort: true, 
              width: "120px",
              formatter: (cell) => cell ? Number(cell).toLocaleString('ru-RU') + ' ₽' : 'По запросу'
            },
            { 
              name: "Склад ЭТМ", 
              id: "stock_etm", 
              sort: true, 
              width: "130px",
              formatter: (cell) => {
                const val = Number(cell) || 0;
                const cls = val > 0 ? 'bg-success' : 'bg-light text-muted border';
                return gridjs.html(`<span class="badge ${cls} stock-badge">${val}</span>`);
              }
            },
            { 
              name: "Склад производителя", 
              id: "stock_vendor", 
              sort: true, 
              width: "180px",
              formatter: (cell) => {
                const val = Number(cell) || 0;
                const cls = val > 0 ? 'bg-primary' : 'bg-light text-muted border';
                return gridjs.html(`<span class="badge ${cls} stock-badge">${val}</span>`);
              }
            },
            { name: "URL", id: "url", hidden: true }
          ],
          data: payload.items,
          search: true,
          pagination: { limit: 25 },
          sort: true,
          language: {
            search: { placeholder: 'Поиск по бренду, артикулу, названию...' },
            pagination: {
              previous: 'Назад',
              next: 'Вперед',
              showing: 'Показаны с',
              to: 'по',
              of: 'из',
              results: 'позиций'
            },
            loading: 'Загрузка...',
            noRecordsFound: 'Ничего не найдено'
          }
        }).render(document.getElementById("table-wrapper"));
      })
      .catch(err => {
        document.getElementById('table-wrapper').innerHTML = 
          `<div class="alert alert-danger">Ошибка загрузки data.json: ${err.message}</div>`;
      });
  </script>
</body>
</html>
